name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev pkg-config gfortran

      - name: Install system packages (macOS)
        if: runner.os == 'macOS'
        run: brew install openblas pkg-config

      - name: Install bbstrader (with extras)
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            pip install -e ".[all]"
          else
            # "all" pulls in "mt5", which has no Linux/macOS wheel.
            pip install -e ".[nlp,social,viz,catalog]"
          fi
          pip install pytest pytest-mock

      - name: Download spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Run pytest
        # test_metatrader_client requires a live MetaTrader 5 terminal on Windows.
        run: pytest tests -k "not test_metatrader_client" -v
