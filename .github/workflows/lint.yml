name: lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install lint dependencies
        run: uv pip install --system ruff mypy types-PyYAML types-tabulate

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy (advisory)
        # The codebase's type coverage is being improved incrementally (see
        # CONTRIBUTING.md); mypy findings are surfaced here without failing CI.
        continue-on-error: true
        run: mypy

  cpp:
    name: C++ (clang-format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting (advisory)
        # clang-format is applied automatically via the BBSTRADER_APPLY_FORMATING CMake
        # option during local builds; this job surfaces drift without failing CI while
        # the tracked sources catch up (see CONTRIBUTING.md).
        continue-on-error: true
        run: |
          files=$(find include src/cpp -type f \( -name "*.hpp" -o -name "*.h" -o -name "*.cpp" \))
          clang-format --dry-run --Werror $files
