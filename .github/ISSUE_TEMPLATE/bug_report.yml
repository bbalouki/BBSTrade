name: 🐛 Bug Report
description: Report a reproducible bug or regression in bbstrader.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please search [existing issues](https://github.com/bbalouki/bbstrader/issues) first to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal, self-contained code or CLI commands that reproduce the issue.
      placeholder: |
        1. Run `python -m bbstrader --run backtest --strategy ...`
        2. ...
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / traceback
      description: What actually happened? Paste the full error traceback if available.
      render: shell
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      multiple: true
      options:
        - btengine (backtesting)
        - metatrader (MT5 bridge / C++ client)
        - trading (live execution)
        - models (quant/NLP models)
        - core
        - api / bindings
        - CLI
        - Docs
        - Packaging / build
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: bbstrader version
      description: Output of `python -c "import bbstrader; print(bbstrader.__version__)"`
      placeholder: "2.4.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12.4"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I am using the latest released version of bbstrader.
          required: false
